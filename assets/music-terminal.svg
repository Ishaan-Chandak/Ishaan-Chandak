<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-labelledby="title desc">
  <title id="title">Battle soundtrack terminal</title>
  <desc id="desc">A retro game terminal ready to display recent Spotify tracks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#102a3c"/></linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5h1200" stroke="#35d0ba" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="235" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="235" rx="20" fill="url(#scan)" stroke="#23445a" stroke-width="2"/>
  <circle cx="32" cy="27" r="6" fill="#ff6b6b"/><circle cx="52" cy="27" r="6" fill="#f7c948"/><circle cx="72" cy="27" r="6" fill="#35d0ba"/>
  <text x="600" y="33" text-anchor="middle" fill="#73849a" font-family="Consolas,monospace" font-size="13">LOOT_RADIO.EXE</text>
  <path d="M24 51h1152" stroke="#23445a"/>
  <g transform="translate(53 77)" font-family="Consolas,monospace">
    <circle cx="59" cy="59" r="57" fill="#0d1c2d" stroke="#1db954" stroke-width="3"/>
    <circle cx="59" cy="59" r="40" fill="none" stroke="#1db954" stroke-opacity=".3"/>
    <path d="M29 45q33-10 65 7M32 60q31-8 58 6M36 75q25-6 49 5" fill="none" stroke="#1db954" stroke-width="7" stroke-linecap="round"/>
    <text x="150" y="25" fill="#35d0ba" font-size="15" letter-spacing="3">BATTLE SOUNDTRACK</text>
    <text x="150" y="62" fill="#fff" font-size="25" font-weight="700">AWAITING PLAYER LINK...</text>
    <text x="150" y="94" fill="#c9d7e5" font-size="16">Pair Spotify to reveal the last 5 tracks played.</text>
    <rect x="150" y="115" width="860" height="9" rx="5" fill="#1d3344"/>
    <rect x="150" y="115" width="215" height="9" rx="5" fill="#1db954" opacity=".75"/>
    <text x="1028" y="124" fill="#73849a" text-anchor="end" font-size="12">SYNC 25%</text>
  </g>
</svg>

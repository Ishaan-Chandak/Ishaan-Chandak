<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ishaan Chandak player card</title>
  <desc id="desc">A game-inspired software engineer profile banner with level, role, and skill stats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#102a3c"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" x2="1">
      <stop stop-color="#35d0ba"/>
      <stop offset="1" stop-color="#69f0cf"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#35d0ba" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 273L260 170l170 68 230-158 210 118 330-115v277H0z" fill="#35d0ba" opacity=".035"/>
  <path d="M0 309l280-83 178 58 220-132 198 92 324-82" fill="none" stroke="#35d0ba" stroke-opacity=".17" stroke-width="2"/>

  <g transform="translate(65 58)">
    <rect width="174" height="174" rx="22" fill="#0d1c2d" stroke="#35d0ba" stroke-width="2"/>
    <path d="M87 25l49 29v58l-49 29-49-29V54z" fill="#102f3d" stroke="#35d0ba" stroke-width="3" filter="url(#glow)"/>
    <text x="87" y="103" text-anchor="middle" fill="#f7c948" font-family="Consolas,monospace" font-size="47" font-weight="700">IC</text>
    <rect x="17" y="150" width="140" height="9" rx="5" fill="#1d3344"/>
    <rect x="17" y="150" width="119" height="9" rx="5" fill="url(#xp)"/>
    <text x="87" y="194" text-anchor="middle" fill="#73849a" font-family="Consolas,monospace" font-size="12">8,500 / 10,000 XP</text>
  </g>

  <g transform="translate(282 65)" font-family="Consolas,monospace">
    <text fill="#35d0ba" font-size="17" letter-spacing="3">PLAYER ONE</text>
    <text y="55" fill="#ffffff" font-size="43" font-weight="700">ISHAAN CHANDAK</text>
    <text y="88" fill="#c9d7e5" font-size="19">Software Engineer · Systems Builder · AI/ML</text>
    <g transform="translate(0 122)">
      <rect width="366" height="42" rx="8" fill="#0d1c2d" stroke="#23445a"/>
      <text x="16" y="27" fill="#73849a" font-size="14">CLASS</text>
      <text x="350" y="27" text-anchor="end" fill="#f7c948" font-size="15">FULL-STACK ENGINEER</text>
    </g>
    <g transform="translate(0 174)">
      <rect width="366" height="42" rx="8" fill="#0d1c2d" stroke="#23445a"/>
      <text x="16" y="27" fill="#73849a" font-size="14">GUILD</text>
      <text x="350" y="27" text-anchor="end" fill="#f7c948" font-size="15">GOLDMAN SACHS</text>
    </g>
  </g>

  <g transform="translate(735 65)" font-family="Consolas,monospace">
    <text fill="#35d0ba" font-size="17" letter-spacing="3">CORE STATS</text>
    <g font-size="15">
      <text y="47" fill="#c9d7e5">SYSTEMS</text><text x="365" y="47" text-anchor="end" fill="#f7c948">92</text>
      <rect y="57" width="365" height="8" rx="4" fill="#1d3344"/><rect y="57" width="336" height="8" rx="4" fill="#35d0ba"/>
      <text y="94" fill="#c9d7e5">AUTOMATION</text><text x="365" y="94" text-anchor="end" fill="#f7c948">96</text>
      <rect y="104" width="365" height="8" rx="4" fill="#1d3344"/><rect y="104" width="350" height="8" rx="4" fill="#35d0ba"/>
      <text y="141" fill="#c9d7e5">AI / ML</text><text x="365" y="141" text-anchor="end" fill="#f7c948">86</text>
      <rect y="151" width="365" height="8" rx="4" fill="#1d3344"/><rect y="151" width="314" height="8" rx="4" fill="#35d0ba"/>
      <text y="188" fill="#c9d7e5">LEADERSHIP</text><text x="365" y="188" text-anchor="end" fill="#f7c948">90</text>
      <rect y="198" width="365" height="8" rx="4" fill="#1d3344"/><rect y="198" width="329" height="8" rx="4" fill="#35d0ba"/>
    </g>
  </g>
  <text x="1136" y="331" text-anchor="end" fill="#73849a" font-family="Consolas,monospace" font-size="12">STATUS: ONLINE · QUESTING SINCE 2021</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Ishaan Chandak - software engineer command deck</title>
  <desc id="desc">An animated sci-fi profile banner with Ishaan Chandak's identity, engineering role, and contact channels.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050A14"/><stop offset=".5" stop-color="#091827"/><stop offset="1" stop-color="#0E2B38"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#35D0BA" stop-opacity=".17"/><stop offset="1" stop-color="#35D0BA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" x2="1"><stop stop-color="#69F0CF"/><stop offset="1" stop-color="#1B8F88"/></linearGradient>
    <linearGradient id="cubeLeft" x1="0" x2="1"><stop stop-color="#102F3D"/><stop offset="1" stop-color="#07131F"/></linearGradient>
    <linearGradient id="cubeRight" x1="0" x2="1"><stop stop-color="#164A55"/><stop offset="1" stop-color="#0A1C29"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#FFF0A3"/><stop offset="1" stop-color="#F7C948"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#FFFFFF"/><stop offset=".2" stop-color="#F7C948"/><stop offset=".65" stop-color="#35D0BA" stop-opacity=".6"/><stop offset="1" stop-color="#35D0BA" stop-opacity="0"/></radialGradient>
    <pattern id="microgrid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#35D0BA" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="frame"><rect width="1200" height="480" rx="26"/></clipPath>
    <style>
      .orbit-a{transform-origin:600px 246px;animation:spin 13s linear infinite}.orbit-b{transform-origin:600px 246px;animation:spinBack 19s linear infinite}.float{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.dash{animation:dash 7s linear infinite}.blink{animation:blink 1.1s steps(2,end) infinite}.p1{animation:particle 4.8s ease-in-out infinite}.p2{animation:particle 6s ease-in-out infinite -2s}.p3{animation:particle 5.3s ease-in-out infinite -1s}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes scan{0%{transform:translateY(-60px);opacity:0}15%{opacity:.35}85%{opacity:.35}100%{transform:translateY(520px);opacity:0}}
      @keyframes dash{to{stroke-dashoffset:-180}}@keyframes blink{50%{opacity:.15}}
      @keyframes particle{0%,100%{transform:translateY(8px);opacity:.25}50%{transform:translateY(-15px);opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="url(#space)"/>
    <rect width="1200" height="480" fill="url(#microgrid)"/>
    <ellipse cx="600" cy="435" rx="500" ry="130" fill="url(#floor)"/>
    <ellipse cx="600" cy="408" rx="305" ry="52" fill="#35D0BA" opacity=".12" filter="url(#soft)"/>

    <!-- perspective command deck -->
    <path d="M77 397L355 260 600 401 358 472z" fill="#07131F" stroke="#1B5361" stroke-width="2"/>
    <path d="M1123 397L845 260 600 401 842 472z" fill="#07131F" stroke="#1B5361" stroke-width="2"/>
    <path d="M355 260L600 119 845 260 600 401z" fill="#091C29" fill-opacity=".78" stroke="#35D0BA" stroke-opacity=".35"/>
    <path d="M600 150v230M383 275l434 0M425 250l350 202M775 250L425 452" fill="none" stroke="#35D0BA" stroke-opacity=".09"/>
    <path d="M140 398l216-106 192 111-190 56zM1060 398L844 292 652 403l190 56z" fill="none" stroke="#35D0BA" stroke-opacity=".15" stroke-dasharray="5 10" class="dash"/>

    <!-- animated orbital system -->
    <g fill="none" filter="url(#glow)">
      <ellipse cx="600" cy="246" rx="183" ry="61" stroke="#35D0BA" stroke-width="2" stroke-dasharray="28 14" class="orbit-a"/>
      <ellipse cx="600" cy="246" rx="128" ry="178" transform="rotate(61 600 246)" stroke="#F7C948" stroke-width="1.5" stroke-dasharray="7 18" class="orbit-b"/>
    </g>
    <g class="pulse" transform-origin="600 246"><circle cx="600" cy="246" r="72" fill="url(#core)" opacity=".35"/></g>

    <!-- floating 3D player core -->
    <g class="float">
      <path d="M600 156l91 52-91 53-91-53z" fill="url(#cubeTop)" stroke="#69F0CF" stroke-width="2"/>
      <path d="M509 208l91 53v105l-91-53z" fill="url(#cubeLeft)" stroke="#24796F" stroke-width="2"/>
      <path d="M691 208l-91 53v105l91-53z" fill="url(#cubeRight)" stroke="#35D0BA" stroke-width="2"/>
      <path d="M600 261v105M509 208l91 53 91-53" fill="none" stroke="#A8FFF0" stroke-opacity=".55"/>
      <text x="600" y="224" text-anchor="middle" fill="#06121D" font-family="Consolas,monospace" font-size="34" font-weight="900">IC</text>
      <text x="552" y="291" text-anchor="middle" fill="#F7C948" font-family="Consolas,monospace" font-size="17" font-weight="700" transform="rotate(30 552 291)">BUILD</text>
      <text x="647" y="290" text-anchor="middle" fill="#69F0CF" font-family="Consolas,monospace" font-size="16" font-weight="700" transform="rotate(-30 647 290)">SHIP</text>
    </g>

    <!-- left holographic identity panel -->
    <g font-family="Consolas,monospace">
      <path d="M39 63h385l37 27v145H76l-37-27z" fill="#081725" fill-opacity=".9" stroke="#35D0BA" stroke-opacity=".55"/>
      <path d="M39 63h92M39 63v48M424 63v42" fill="none" stroke="#35D0BA" stroke-width="3"/>
      <text x="72" y="96" fill="#35D0BA" font-size="13" letter-spacing="4">PLAYER IDENTIFIED</text>
      <text x="72" y="139" fill="#FFFFFF" font-size="32" font-weight="900">ISHAAN CHANDAK</text>
      <text x="72" y="169" fill="#C9D7E5" font-size="16">SOFTWARE ENGINEER</text>
      <path d="M72 189h318" stroke="#23445A"/>
      <text x="72" y="215" fill="#73849A" font-size="12">STATUS</text>
      <circle cx="158" cy="210" r="5" fill="#35D0BA" filter="url(#glow)" class="blink"/>
      <text x="174" y="215" fill="#35D0BA" font-size="13">OPEN TO COLLABORATE</text>
    </g>

    <!-- contact command panel -->
    <g font-family="Consolas,monospace">
      <path d="M776 63h385v145l-37 27H739V90z" fill="#081725" fill-opacity=".9" stroke="#F7C948" stroke-opacity=".48"/>
      <path d="M1161 63h-92M1161 63v48M776 63v42" fill="none" stroke="#F7C948" stroke-width="3"/>
      <text x="772" y="96" fill="#F7C948" font-size="13" letter-spacing="4">OPEN COMMS</text>
      <circle cx="1122" cy="91" r="6" fill="#35D0BA" filter="url(#glow)" class="blink"/>
      <text x="1107" y="96" text-anchor="end" fill="#35D0BA" font-size="11">2 CHANNELS ONLINE</text>
      <rect x="772" y="116" width="352" height="41" rx="7" fill="#0D2230" stroke="#35D0BA" stroke-opacity=".7"/>
      <circle cx="795" cy="136" r="11" fill="#35D0BA"/><text x="795" y="141" text-anchor="middle" fill="#06121D" font-size="13" font-weight="900">in</text>
      <text x="818" y="140" fill="#FFFFFF" font-size="15" font-weight="700">LINKEDIN // CONNECT</text>
      <text x="1107" y="140" text-anchor="end" fill="#35D0BA" font-size="12">↗</text>
      <rect x="772" y="169" width="352" height="41" rx="7" fill="#0D2230" stroke="#F7C948" stroke-opacity=".7"/>
      <path d="M785 181h21v15h-21zM785 181l10.5 9 10.5-9" fill="none" stroke="#F7C948" stroke-width="2"/>
      <text x="818" y="193" fill="#FFFFFF" font-size="15" font-weight="700">EMAIL // SEND MESSAGE</text>
      <text x="1107" y="193" text-anchor="end" fill="#F7C948" font-size="12">↗</text>
    </g>

    <!-- atmospheric deck beacons: visual depth without repeated skill labels -->
    <g fill="none" stroke="#35D0BA" stroke-opacity=".32">
      <path d="M124 371l96-47 96 47-96 48zM884 371l96-47 96 47-96 48z"/>
      <ellipse cx="220" cy="371" rx="48" ry="15" stroke-dasharray="6 10" class="dash"/>
      <ellipse cx="980" cy="371" rx="48" ry="15" stroke-dasharray="6 10" class="dash"/>
      <path d="M220 325v94M980 325v94" stroke-opacity=".14"/>
    </g>
    <g fill="#35D0BA" filter="url(#glow)"><circle cx="220" cy="371" r="5" class="blink"/><circle cx="980" cy="371" r="5" class="blink"/></g>
    <g font-family="Consolas,monospace" text-anchor="middle">
      <text x="220" y="397" fill="#73849A" font-size="9" letter-spacing="2">BUILD NODE</text>
      <text x="980" y="356" fill="#F7C948" font-size="13" font-weight="900">&lt;/&gt;</text>
      <text x="980" y="397" fill="#73849A" font-size="9" letter-spacing="2">SHIP NODE</text>
    </g>

    <!-- particles and telemetry -->
    <g fill="#69F0CF" filter="url(#glow)"><circle cx="473" cy="115" r="3" class="p1"/><circle cx="717" cy="352" r="3" class="p2"/><circle cx="514" cy="405" r="2" class="p3"/><circle cx="699" cy="121" r="2" class="p2"/></g>
    <g font-family="Consolas,monospace" font-size="11" fill="#73849A">
      <text x="32" y="452">SYS://PLAYER-01</text><text x="1168" y="452" text-anchor="end">MUMBAI // 19.0760° N</text>
      <text x="600" y="454" text-anchor="middle" fill="#35D0BA">COMMAND DECK // READY</text>
    </g>
    <rect x="0" y="-80" width="1200" height="40" fill="#35D0BA" opacity=".07" class="scan"/>
    <rect x="1" y="1" width="1198" height="478" rx="25" fill="none" stroke="#35D0BA" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ishaan Chandak — Software Engineer</title>
  <desc id="desc">A compact profile banner introducing Ishaan Chandak, a software engineer who builds, breaks, learns, and builds better.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050A14"/><stop offset=".55" stop-color="#091827"/><stop offset="1" stop-color="#0E2B38"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#69F0CF"/><stop offset="1" stop-color="#35D0BA"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0A3"/><stop offset="1" stop-color="#F7C948"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#35D0BA" stop-opacity=".28"/><stop offset="1" stop-color="#35D0BA" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#69F0CF" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>
      .orbit{transform-origin:1012px 150px;animation:spin 18s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.dash{animation:dash 9s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45}}@keyframes dash{to{stroke-dashoffset:-120}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <path d="M0 252C222 216 386 281 590 251S943 210 1200 246V300H0z" fill="#35D0BA" opacity=".035"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <g transform="translate(58 42)"><circle cx="6" cy="6" r="6" fill="#35D0BA" filter="url(#glow)" class="pulse"/><text x="24" y="11" fill="#69F0CF" font-size="13" font-weight="700" letter-spacing="3">HELLO, I'M</text></g>
      <text x="58" y="116" fill="#FFFFFF" font-size="52" font-weight="800" letter-spacing="-1.5">ISHAAN CHANDAK</text>
      <text x="60" y="151" fill="#C9D7E5" font-size="19" font-weight="600" letter-spacing="1.5">SOFTWARE ENGINEER</text>
      <rect x="60" y="169" width="62" height="4" rx="2" fill="url(#gold)"/>
      <text x="60" y="207" fill="#FFFFFF" font-size="21" font-weight="500">I build, break, learn, <tspan fill="#35D0BA">and build better.</tspan></text>
      <g transform="translate(60 238)" fill="none">
        <path d="M0 12h26l11-11h132l11 11h132l11-11h126" stroke="#23445A" stroke-width="2"/>
        <path d="M0 12h26l11-11h58M333 1h126" stroke="#35D0BA" stroke-width="2" stroke-linecap="round" class="dash"/>
        <circle cx="37" cy="1" r="4" fill="#F7C948" filter="url(#glow)"/>
        <circle cx="180" cy="12" r="4" fill="#35D0BA" filter="url(#glow)"/>
        <circle cx="333" cy="1" r="4" fill="#69F0CF" filter="url(#glow)"/>
      </g>
    </g>
    <g>
      <circle cx="1012" cy="150" r="142" fill="url(#halo)"/>
      <circle cx="1012" cy="150" r="104" fill="#07131F" fill-opacity=".76" stroke="#23445A"/>
      <circle cx="1012" cy="150" r="86" fill="none" stroke="#35D0BA" stroke-opacity=".55" stroke-width="2" stroke-dasharray="8 12" class="orbit"/>
      <path d="M1012 79l62 36v71l-62 36-62-36v-71z" fill="#0D2733" stroke="url(#accent)" stroke-width="2"/>
      <path d="M1012 79v143M950 115l62 36 62-36M950 186l62-35 62 35" fill="none" stroke="#35D0BA" stroke-opacity=".26"/>
      <text x="1012" y="166" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="-3">IC</text>
      <circle cx="924" cy="98" r="4" fill="#F7C948" filter="url(#glow)"/><circle cx="1096" cy="201" r="4" fill="#35D0BA" filter="url(#glow)"/>
      <path d="M924 98l31 19M1069 184l27 17" fill="none" stroke="#73849A" stroke-dasharray="4 6" class="dash"/>
    </g>
    <path d="M1 24V1h23M1176 1h23v23M1 276v23h23M1176 299h23v-23" fill="none" stroke="#35D0BA" stroke-width="2" stroke-opacity=".65"/>
    <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#35D0BA" stroke-opacity=".28" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Technology constellation</title><desc id="desc">A static star-map visualization of Ishaan's engineering toolkit.</desc>
<defs><linearGradient id="bg" x2="1"><stop stop-color="#050A14"/><stop offset="1" stop-color="#0E2B38"/></linearGradient><radialGradient id="halo"><stop stop-color="#35D0BA" stop-opacity=".28"/><stop offset="1" stop-color="#35D0BA" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="stars" width="67" height="53" patternUnits="userSpaceOnUse"><circle cx="8" cy="11" r="1" fill="#69F0CF" opacity=".22"/><circle cx="48" cy="39" r=".7" fill="#F7C948" opacity=".22"/></pattern></defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/><rect width="1200" height="430" rx="22" fill="url(#stars)" stroke="#23445A" stroke-width="2"/>
<g font-family="Consolas,monospace"><text x="48" y="49" fill="#35D0BA" font-size="13" letter-spacing="4">TECH CONSTELLATION // NAV MAP</text><text x="1152" y="49" text-anchor="end" fill="#73849A" font-size="12">STATIC VIEW · ALL SYSTEMS NOMINAL</text>
<g fill="none" stroke="#35D0BA" stroke-opacity=".24"><ellipse cx="600" cy="230" rx="430" ry="148"/><ellipse cx="600" cy="230" rx="285" ry="98"/><path d="M170 230h860M600 82v296" stroke-dasharray="3 10"/><path d="M231 154l184 25 185 51 194-67 175 91M205 289l210-110 185 51 174 73 221-82"/></g>
<circle cx="600" cy="230" r="92" fill="url(#halo)"/><circle cx="600" cy="230" r="42" fill="#0D2733" stroke="#F7C948" stroke-width="2" filter="url(#glow)"/><text x="600" y="225" text-anchor="middle" fill="#F7C948" font-size="13" letter-spacing="2">CORE</text><text x="600" y="247" text-anchor="middle" fill="#fff" font-size="17" font-weight="900">ENGINEERING</text>
<!-- language orbit --><g><circle cx="231" cy="154" r="11" fill="#35D0BA" filter="url(#glow)"/><text x="231" y="130" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">PYTHON</text><text x="231" y="184" text-anchor="middle" fill="#73849A" font-size="10">LANGUAGE</text><circle cx="205" cy="289" r="8" fill="#69F0CF"/><text x="205" y="318" text-anchor="middle" fill="#C9D7E5" font-size="13">C++</text><circle cx="415" cy="179" r="8" fill="#69F0CF"/><text x="415" y="157" text-anchor="middle" fill="#C9D7E5" font-size="13">GO</text><circle cx="415" cy="335" r="7" fill="#69F0CF"/><text x="415" y="365" text-anchor="middle" fill="#C9D7E5" font-size="13">SQL</text></g>
<!-- model orbit --><g><circle cx="794" cy="163" r="11" fill="#F7C948" filter="url(#glow)"/><text x="794" y="137" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">PYTORCH</text><text x="794" y="193" text-anchor="middle" fill="#73849A" font-size="10">MODEL FORGE</text><circle cx="969" cy="254" r="8" fill="#F7C948"/><text x="969" y="284" text-anchor="middle" fill="#C9D7E5" font-size="13">OPENCV</text><circle cx="774" cy="303" r="7" fill="#F7C948"/><text x="774" y="333" text-anchor="middle" fill="#C9D7E5" font-size="13">NUMPY</text></g>
<!-- platform orbit --><g><circle cx="995" cy="221" r="10" fill="#35D0BA" filter="url(#glow)"/><text x="995" y="199" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">AWS</text><circle cx="978" cy="343" r="7" fill="#69F0CF"/><text x="978" y="373" text-anchor="middle" fill="#C9D7E5" font-size="13">DOCKER</text><circle cx="342" cy="245" r="7" fill="#69F0CF"/><text x="342" y="274" text-anchor="middle" fill="#C9D7E5" font-size="13">REACT</text></g>
<g fill="#73849A" font-size="10"><text x="48" y="399">01 · LANGUAGES</text><text x="600" y="399" text-anchor="middle">02 · INTELLIGENCE</text><text x="1152" y="399" text-anchor="end">03 · PLATFORMS</text></g></g>

name: Generate contribution dungeon

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2335D0BA&color_dots=%23E8EEF2,%23B8F2E8,%2369F0CF,%2335D0BA,%2300A88F
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F7C948&color_dots=%2308111F,%23144A50,%231C756E,%2335D0BA,%2369F0CF

      - name: Generate Loot Radio
        run: python scripts/generate_battle_soundtrack.py --output dist/battle-soundtrack.svg

      - name: Generate Challenge Arena
        run: python scripts/generate_leetcode_arena.py --output dist

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
